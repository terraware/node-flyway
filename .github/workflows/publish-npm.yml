name: Publish npm package

on:
  push:
    # Push a tag matching package.json's version (e.g. v0.0.13-terraware.1) to publish.
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      # Lets npm authenticate to the registry via OIDC (trusted publishing) instead of a long-lived token.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME implies $TAG_VERSION but package.json is $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $PACKAGE_VERSION"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # npm refuses to publish a prerelease version (e.g. 0.0.13-terraware.1) without an explicit
      # dist-tag. Our fork's versions are all prereleases of the upstream version they're based on,
      # and each one is the version consumers should get, so publish it as `latest`.
      - name: Publish npm package
        run: npm publish --provenance --access public --tag latest
